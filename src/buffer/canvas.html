<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Website Builder</title>
	<!--
		Editor-only styles. Page styles (base, templates, site CSS and the
		generated per-element rules) are injected by the builder and are the
		only styles that get exported.
	-->
	<style>
		body {
			position: relative;
			min-height: 100vh;
		}

		#drop-zone-skeleton {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1rem;
			width: 100%;
			min-height: 100vh;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}

		#drop-zone-box {
			width: 80px;
			height: 80px;
			border: 2px dashed #ccc;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 1rem;
		}

		#drop-zone-plus {
			font-size: 2rem;
			line-height: 1;
			color: #aaa;
		}

		#drop-zone-label {
			color: #999;
			font-size: 0.9rem;
		}

		#drop-line {
			position: absolute;
			display: none;
			pointer-events: none;
			z-index: 2147483647;
			background: limegreen;
		}

		/* Hover / selection */
		[data-buffer]:hover:not(:has([data-buffer]:hover)) {
			outline: 1px dashed rgba(0, 114, 244, .7);
			outline-offset: -1px;
		}

		.wb-selected {
			outline: 2px solid #0072F4 !important;
			outline-offset: -2px !important;
		}

		/* Inside a selected component, show which element the next click selects */
		.wb-selected :hover:not(:has(:hover)),
		[data-buffer]:has(.wb-selected) :hover:not(:has(:hover)) {
			outline: 1px dashed rgba(0, 114, 244, .6);
			outline-offset: -1px;
		}

		/* Selection toolbar */
		#wb-toolbar {
			position: absolute;
			z-index: 2147483646;
			display: none;
			align-items: center;
			gap: 1px;
			height: 24px;
			padding: 0 2px;
			border-radius: 4px 4px 0 0;
			background: #0072F4;
			color: #fff;
			font: 500 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			white-space: nowrap;
			box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
		}

		#wb-toolbar.show {
			display: flex;
		}

		/* Faded rather than hidden: it can be the drag source, and hiding the
		   source element makes the browser cancel the drag. */
		.wb-dragging #wb-toolbar {
			opacity: 0;
			pointer-events: none;
		}

		#wb-toolbar button,
		#wb-toolbar .wb-tb-move {
			all: unset;
			display: inline-flex;
			align-items: center;
			gap: 5px;
			height: 22px;
			padding: 0 6px;
			border-radius: 3px;
			cursor: pointer;
		}

		#wb-toolbar .wb-tb-move {
			cursor: grab;
			/* `all: unset` above also resets the browser's draggable styling */
			-webkit-user-drag: element;
			user-select: none;
		}

		#wb-toolbar button:hover,
		#wb-toolbar .wb-tb-move:hover {
			background: rgba(255, 255, 255, .2);
		}

		#wb-toolbar button:disabled {
			opacity: .4;
			cursor: default;
		}

		#wb-toolbar svg {
			width: 12px;
			height: 12px;
			fill: currentColor;
		}

		/* While dragging, emptied containers inside components stay reachable */
		.wb-dragging [data-buffer] :is(div, section, article, aside, li, figure, form, header, footer, main):empty {
			min-height: 24px;
			outline: 1px dashed #cbd5e1;
		}

		[contenteditable="true"] {
			outline: 2px solid #f59e0b !important;
			outline-offset: 2px !important;
			cursor: text;
		}

		/* Empty containers stay visible and droppable */
		.droppable:not(body):empty {
			min-height: 80px;
			outline: 1px dashed #cbd5e1;
			outline-offset: -4px;
		}

		.droppable:not(body):empty::before {
			content: "Drop blocks here";
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			min-height: 80px;
			color: #94a3b8;
			font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}

		.droppable.drop-target-highlight {
			outline: 2px dashed limegreen !important;
			outline-offset: -2px !important;
		}

		/* Embedded media would swallow clicks and drags */
		iframe[data-buffer], [data-buffer] iframe,
		video[data-buffer], [data-buffer] video,
		audio[data-buffer], [data-buffer] audio {
			pointer-events: none;
		}

		/* Debug mode */
		.wb-debug .droppable:not(body) {
			outline: 1px dashed #94a3b8;
			outline-offset: -1px;
		}

		.wb-debug [data-buffer]:not(.droppable) {
			outline: 1px dotted #93c5fd;
		}

		.wb-debug-spacing.wb-dragging .droppable:not(body) {
			padding: 12px !important;
		}
	</style>
</head>
<body>
	<!-- Skeleton -->
	<div id="drop-zone-skeleton">
		<div id="drop-zone-box">
			<span id="drop-zone-plus">+</span>
		</div>
		<label id="drop-zone-label">Drag blocks or templates here to start building</label>
	</div>
</body>
</html>
